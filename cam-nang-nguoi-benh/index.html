<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện Điện tử Giáo dục Sức khỏe — BVPSTW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Cây dữ liệu GDSK — điều hướng 3 cấp (Nhánh -> Tiểu mục -> Nội dung)
   theo quy tắc "tối đa 2-3 lần chạm". Điều hướng bằng URL hash để hỗ trợ
   mã QR dẫn thẳng vào từng khoa (#/4, #/6...) mà vẫn dùng chung 1 trang.
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --purple:   #6B2D8B;
  --purple-d: #4A1D62;
  --purple-l: #9B59C0;
  --pink:     #D63384;
  --teal:     #00897B;
  --bg:       #F8F4FC;
  --card:     #FFFFFF;
  --text:     #1A1A2E;
  --muted:    #6B7280;
  --border:   #E5E0ED;
  --shadow:   0 4px 24px rgba(107,45,139,.12);
  --radius:   14px;
  --font:     'Be Vietnam Pro', sans-serif;
}
html { scroll-behavior: smooth; }
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: var(--font); cursor: pointer; }

/* NAV */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(255,255,255,.97); backdrop-filter: blur(10px);
  border-bottom: 2px solid var(--purple);
}
.nav-inner { max-width: 960px; margin: auto; display: flex; align-items: center; justify-content: space-between; padding: .75rem 1.25rem; gap: 1rem; flex-wrap: wrap; }
.nav-brand { display: flex; align-items: center; gap: .65rem; }
.nav-logo { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg,var(--purple),var(--pink)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1.3rem; flex-shrink: 0; }
.nav-title strong { display: block; font-size: .92rem; color: var(--purple-d); }
.nav-title span { font-size: .72rem; color: var(--muted); }
.nav-home { font-size: .82rem; font-weight: 600; color: var(--purple); padding: .4rem .9rem; border: 2px solid var(--border); border-radius: 999px; transition: .2s; }
.nav-home:hover { border-color: var(--purple); }

.wrap { max-width: 960px; margin: auto; padding: 1.75rem 1.25rem 4rem; }

/* BREADCRUMB */
.crumb { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; font-size: .85rem; color: var(--muted); margin-bottom: 1.5rem; }
.crumb button { background: none; border: none; color: var(--purple); font-weight: 700; font-size: .85rem; padding: 0; }
.crumb button:hover { text-decoration: underline; }
.crumb .sep { color: var(--border); }
.crumb .cur { color: var(--text); font-weight: 600; }

/* HEADER BLOCK */
.view-head { margin-bottom: 1.75rem; }
.view-head h1 { font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 800; color: var(--purple-d); }
.view-head p { color: var(--muted); font-size: .9rem; margin-top: .4rem; max-width: 60ch; }
.tap-note { display: inline-flex; align-items: center; gap: .4rem; background: rgba(107,45,139,.08); color: var(--purple-d); font-size: .78rem; font-weight: 600; padding: .35rem .8rem; border-radius: 999px; margin-top: .6rem; }

/* BRANCH GRID (cấp 1) */
.featured { display:flex; flex-direction:column; gap:.7rem; margin-bottom:1.2rem; }
.featured-card { display:flex; align-items:center; gap:1rem; width:100%; text-align:left; border:0; color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--pink)); border-radius:var(--radius); padding:1rem 1.2rem; box-shadow:var(--shadow); }
.featured-card .f-icon { font-size:2.2rem; flex-shrink:0; }
.featured-card .f-badge { display:inline-block; background:#fff; color:var(--pink); font-size:.7rem; font-weight:800; padding:.1rem .55rem; border-radius:99px; margin-bottom:.25rem; }
.featured-card h3 { font-size:1.05rem; font-weight:700; line-height:1.35; }
.featured-card p { font-size:.85rem; opacity:.92; }
.featured-card .f-go { margin-left:auto; font-size:1.4rem; flex-shrink:0; }
.branch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 1rem; }
.branch-card {
  background: var(--card); border-radius: var(--radius); padding: 1.4rem;
  box-shadow: var(--shadow); border-top: 4px solid var(--purple);
  display: flex; gap: 1rem; align-items: flex-start;
  transition: transform .15s, box-shadow .15s; text-align: left; border-width: 0; border-top-width: 4px; width: 100%;
}
.branch-card:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(107,45,139,.2); }
.branch-icon { font-size: 1.9rem; flex-shrink: 0; width: 46px; height: 46px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: center; }
.branch-body h3 { font-size: 1rem; font-weight: 700; color: var(--purple-d); margin-bottom: .3rem; }
.branch-body p { font-size: .78rem; color: var(--muted); }

/* SUB LIST (cấp 2) */
.sub-list { display: flex; flex-direction: column; gap: .85rem; }
.sub-card {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1.1rem 1.3rem; display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; border-left: 4px solid var(--purple-l); width: 100%; border-width: 0; border-left-width: 4px; text-align: left;
}
.sub-card h3 { font-size: .95rem; font-weight: 700; color: var(--text); }
.sub-card .count { font-size: .75rem; color: var(--muted); margin-top: .2rem; }
.sub-arrow { font-size: 1.1rem; color: var(--purple); flex-shrink: 0; }

/* ITEM LIST (cấp 3) */
.item-list { display: flex; flex-direction: column; gap: .75rem; }
.item-row {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 1rem 1.2rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
.item-title { font-size: .9rem; font-weight: 600; color: var(--text); flex: 1; min-width: 180px; }
.item-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.act-btn {
  display: inline-flex; align-items: center; gap: .4rem;
  background: var(--bg); border: 2px solid var(--border); color: var(--purple-d);
  font-size: .8rem; font-weight: 700; padding: .5rem 1rem; border-radius: 999px; transition: .2s;
}
.act-btn.img { }
.act-btn.vid { }
.act-btn:hover { background: var(--purple); border-color: var(--purple); color: #fff; }
.soon-tag { font-size: .76rem; font-weight: 700; color: var(--muted); background: var(--bg); padding: .4rem .9rem; border-radius: 999px; }
.empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
.empty-state .ic { font-size: 2rem; margin-bottom: .5rem; }
.empty-state p { font-size: .88rem; }

/* VIEWER MODAL */
.viewer-overlay {
  position: fixed; inset: 0; background: rgba(20,10,28,.78); z-index: 999;
  display: flex; align-items: center; justify-content: center; padding: 1rem;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.viewer-overlay.open { opacity: 1; pointer-events: all; }
.viewer-box { background: #fff; border-radius: 18px; max-width: 560px; width: 100%; max-height: 92vh; overflow: auto; }
.viewer-top { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); }
.viewer-top h3 { font-size: .95rem; font-weight: 700; color: var(--purple-d); padding-right: 1rem; }
.viewer-close { background: var(--bg); border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; flex-shrink: 0; }
.viewer-media { background: #0B0F13; display: flex; align-items: center; justify-content: center; }
.viewer-media img { width: 100%; height: auto; }
.viewer-media.article { display: block; background: #fff; padding: 1.1rem 1.2rem; }
.article-body { font-size: .95rem; line-height: 1.7; color: var(--text); }
.article-body h2 { font-size: 1.15rem; color: var(--purple-d); margin: 1.1rem 0 .4rem; }
.article-body h3 { font-size: 1.02rem; color: var(--purple-d); margin: 1rem 0 .3rem; }
.article-body p { margin: .55rem 0; }
.article-body ul, .article-body ol { margin: .5rem 0 .5rem 1.3rem; }
.article-body img { max-width: 100%; height: auto; border-radius: 10px; margin: .6rem 0; }
.article-body a { color: var(--purple); text-decoration: underline; }
.article-body blockquote { border-left: 4px solid var(--purple-l); padding: .2rem .9rem; color: var(--muted); margin: .7rem 0; }
.article-body table { border-collapse: collapse; width: 100%; font-size: .88rem; margin: .7rem 0; }
.article-body th, .article-body td { border: 1px solid var(--border); padding: .35rem .5rem; text-align: left; }
.viewer-media video { width: 100%; max-height: 70vh; display: block; }
.viewer-feedback { padding: 1.1rem 1.2rem 1.3rem; text-align: center; }
.viewer-feedback p { font-size: .85rem; font-weight: 600; color: var(--text); margin-bottom: .7rem; }
.fb-btns { display: flex; gap: .7rem; justify-content: center; }
.fb-btn { background: var(--bg); border: 2px solid var(--border); border-radius: 999px; padding: .5rem 1.2rem; font-size: .85rem; font-weight: 700; color: var(--text); transition: .2s; }
.fb-btn:hover { border-color: var(--purple); }
.fb-btn.sent { background: var(--purple); border-color: var(--purple); color: #fff; }
.fb-thanks { font-size: .8rem; color: var(--teal); font-weight: 700; margin-top: .6rem; display: none; }
.fb-thanks.show { display: block; }

/* FOOTER */
.footer { text-align: center; color: var(--muted); font-size: .78rem; padding: 2rem 1.25rem 1rem; }

@media (max-width: 560px) {
  .branch-grid { grid-template-columns: 1fr; }
  .item-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <div class="nav-logo">🏥</div>
      <div class="nav-title">
        <strong>Thư viện Điện tử GDSK</strong>
        <span>Bệnh viện Phụ Sản Trung Ương</span>
      </div>
    </div>
    <a class="nav-home" id="navHome" href="#"></a>
  </div>
</nav>

<div class="wrap" id="app"></div>

<div class="footer">
  Tài liệu chỉ mang tính chất tham khảo, không thay thế cho chẩn đoán và chỉ định của bác sĩ.<br>
  Khoa liên quan vui lòng liên hệ Phòng Điều dưỡng / Phòng CNTT để cập nhật nội dung.
</div>

<!-- VIEWER -->
<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-box">
    <div class="viewer-top">
      <h3 id="viewerTitle"></h3>
      <button class="viewer-close" id="viewerClose">✕</button>
    </div>
    <div class="viewer-media" id="viewerMedia"></div>
    <div class="viewer-feedback">
      <p>Thông tin này có hữu ích không?</p>
      <div class="fb-btns">
        <button class="fb-btn" id="fbYes">👍 Hữu ích</button>
        <button class="fb-btn" id="fbNo">👎 Chưa hữu ích</button>
      </div>
      <div class="fb-thanks" id="fbThanks">Cảm ơn bạn đã phản hồi!</div>
    </div>
  </div>
</div>

<script src="gdsk-config.js"></script>
<script src="data.js"></script>
<script>
/* =====================================================
   FIREBASE (dùng chung project sẵn có của Phòng CNTT — miễn phí)
   Chỉ dùng để ghi nhận khảo sát "hữu ích?", không đọc dữ liệu nhạy cảm.
===================================================== */
const FB_URL = GDSK_CONFIG.FB_URL;
const FB_API_KEY = GDSK_CONFIG.FB_API_KEY;
(function(){
  const a=document.getElementById('navHome');
  if(GDSK_CONFIG.HOME_URL){ a.href=GDSK_CONFIG.HOME_URL; a.textContent=GDSK_CONFIG.HOME_LABEL||'← Trang chủ'; }
  else a.style.display='none';
})();
let _fbAuthPromise = null;
async function ensureFbAuth(){
  if(!FB_URL || !FB_API_KEY) return null; // đã tắt ghi nhận trong gdsk-config.js
  try{
    const cached = JSON.parse(sessionStorage.getItem('gdsk_fb_auth')||'null');
    if(cached && cached.expiry > Date.now()) return cached.token;
  }catch(e){}
  if(_fbAuthPromise) return _fbAuthPromise;
  _fbAuthPromise = fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({returnSecureToken:true})
  }).then(r=>r.json()).then(data=>{
    if(!data.idToken) return null;
    const expiry = Date.now() + (parseInt(data.expiresIn||'3600',10)*1000) - 60000;
    try{ sessionStorage.setItem('gdsk_fb_auth', JSON.stringify({token:data.idToken, expiry})); }catch(e){}
    return data.idToken;
  }).catch(()=>null).finally(()=>{ _fbAuthPromise=null; });
  return _fbAuthPromise;
}
async function sendFeedback(itemKey, useful){
  try{
    const token = await ensureFbAuth();
    if(!token) return false;
    const url = `${FB_URL}/feedback/${encodeURIComponent(itemKey)}.json?auth=${token}`;
    await fetch(url, { method:'POST', body: JSON.stringify({ useful, ts: Date.now() }) });
    return true;
  }catch(e){ return false; }
}

/* Đếm LƯỢT XEM — ghi tự động ngay khi mở ảnh/video, không cần bệnh nhân
   làm gì thêm. Tách riêng khỏi khảo sát "hữu ích?" (vốn chỉ ai chủ động
   bấm mới có), để Phòng CNTT biết được mức độ truy cập thực tế.
   Chống đếm trùng trong cùng 1 phiên trình duyệt (mở lại cùng 1 bài). */
function viewedSet(){
  try{ return JSON.parse(sessionStorage.getItem('gdsk_viewed')||'[]'); }catch(e){ return []; }
}
async function logView(itemKey){
  try{
    const seen = viewedSet();
    if(seen.includes(itemKey)) return;
    seen.push(itemKey);
    try{ sessionStorage.setItem('gdsk_viewed', JSON.stringify(seen)); }catch(e){}
    const token = await ensureFbAuth();
    if(!token) return;
    const url = `${FB_URL}/views/${encodeURIComponent(itemKey)}.json?auth=${token}`;
    await fetch(url, { method:'POST', body: JSON.stringify({ ts: Date.now() }) });
  }catch(e){ /* không chặn trải nghiệm xem nội dung nếu ghi nhận lỗi */ }
}

/* =====================================================
   ROUTER — hash dạng #/<branch>/<sub>  (vd: #/4  hoặc  #/4/2)
   Cho phép mã QR chuyên khoa dẫn thẳng vào 1 nhánh (bỏ qua bước chọn nhánh).
===================================================== */
const app = document.getElementById('app');

function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseHash(){
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const parts = raw.split('/').filter(Boolean);
  return { branchId: parts[0] || null, subId: parts[1] || null };
}

function findBranch(id){ return TREE.find(b => b.id === id); }
function findSub(branch, subId){ return branch && branch.subs.find(s => s.id === subId); }

function render(){
  const { branchId, subId } = parseHash();
  if(!branchId){ renderBranches(); return; }
  const branch = findBranch(branchId);
  if(!branch){ renderBranches(); return; }
  if(!subId){ renderSubs(branch); return; }
  const sub = findSub(branch, subId);
  if(!sub){ renderSubs(branch); return; }
  renderItems(branch, sub);
}

function crumbHtml(parts){
  // parts: [{label, href}] cuối cùng là trang hiện tại (không link)
  return `<div class="crumb">` + parts.map((p,i)=>{
    const isLast = i === parts.length-1;
    const sep = i>0 ? '<span class="sep">›</span>' : '';
    if(isLast) return sep + `<span class="cur">${p.label}</span>`;
    return sep + `<button onclick="location.hash='${p.href}'">${p.label}</button>`;
  }).join('') + `</div>`;
}

function renderBranches(){
  app.innerHTML = `
    <div class="view-head">
      <h1>Thư viện Điện tử Giáo dục Sức khỏe</h1>
      <p>Chọn chủ đề quan tâm bên dưới. Mỗi mục chỉ cần 2–3 lần chạm là đến đúng nội dung cần xem.</p>
    </div>
    ${(typeof FEATURED!=='undefined' && FEATURED.length) ? `<div class="featured">${FEATURED.map(f=>`
      <button class="featured-card" onclick="location.hash='${esc(f.href)}'">
        <div class="f-icon">${f.icon}</div>
        <div><span class="f-badge">${esc(f.badge)}</span><h3>${esc(f.title)}</h3><p>${esc(f.desc)}</p></div>
        <div class="f-go">→</div>
      </button>`).join('')}</div>` : ''}
    <div class="branch-grid">
      ${TREE.map(b => `
        <button class="branch-card" onclick="location.hash='/${b.id}'">
          <div class="branch-icon">${esc(b.icon)}</div>
          <div class="branch-body">
            <h3>${esc(b.id)}. ${esc(b.title)}</h3>
            <p>${b.subs.length} tiểu mục</p>
          </div>
        </button>
      `).join('')}
    </div>
  `;
}

function renderSubs(branch){
  app.innerHTML = `
    ${crumbHtml([{label:'Trang đích', href:'/'}, {label:esc(`${branch.id}. ${branch.title}`)}])}
    <div class="view-head">
      <h1>${esc(branch.icon)} ${esc(branch.title)}</h1>
      <span class="tap-note">👆 Chạm để xem nội dung — còn 1 bước nữa</span>
    </div>
    <div class="sub-list">
      ${branch.subs.map(s => {
        const n = s.items.length;
        const countLabel = n ? `${n} nội dung` : 'Đang xây dựng';
        return `
        <button class="sub-card" onclick="location.hash='/${branch.id}/${s.id}'">
          <div>
            <h3>${esc(s.id)} ${esc(s.title)}</h3>
            <div class="count">${countLabel}</div>
          </div>
          <div class="sub-arrow">→</div>
        </button>`;
      }).join('')}
    </div>
  `;
}

function renderItems(branch, sub){
  const hasItems = sub.items.length > 0;
  app.innerHTML = `
    ${crumbHtml([{label:'Trang đích', href:'/'}, {label:esc(`${branch.id}. ${branch.title}`), href:`/${branch.id}`}, {label:esc(`${sub.id} ${sub.title}`)}])}
    <div class="view-head">
      <h1>${esc(sub.title)}</h1>
    </div>
    ${hasItems ? `
    <div class="item-list">
      ${sub.items.map((it, idx) => {
        const key = gdskItemKey(branch, sub, it, idx);
        const hasMedia = it.img || it.video || it.article;
        const actions = [];
        if(it.img) actions.push(`<button class="act-btn img" data-key="${esc(key)}" data-title="${esc(it.title)}" data-type="image" data-src="${esc(it.img)}">🖼️ Xem hình</button>`);
        if(it.article) actions.push(`<button class="act-btn art" data-key="${esc(key)}" data-title="${esc(it.title)}" data-type="article" data-src="${esc(it.article)}">📄 Đọc bài</button>`);
        if(it.video) actions.push(`<button class="act-btn vid" data-key="${esc(key)}" data-title="${esc(it.title)}" data-type="video" data-src="${esc(it.video)}">🎬 Xem Clip</button>`);
        return `
        <div class="item-row">
          <div class="item-title">${esc(it.title)}</div>
          <div class="item-actions">
            ${hasMedia ? actions.join('') : '<span class="soon-tag">Sắp cập nhật</span>'}
          </div>
        </div>`;
      }).join('')}
    </div>
    ` : `
    <div class="empty-state">
      <div class="ic">🛠️</div>
      <p>Nội dung tiểu mục này đang được Phòng Điều dưỡng biên soạn.<br>Vui lòng quay lại sau.</p>
    </div>
    `}
  `;
}

/* =====================================================
   VIEWER (lightbox ảnh / video + khảo sát hữu ích)
===================================================== */
let currentFeedbackKey = null;
const overlay = document.getElementById('viewerOverlay');
const mediaBox = document.getElementById('viewerMedia');
const titleBox = document.getElementById('viewerTitle');
const fbYes = document.getElementById('fbYes');
const fbNo = document.getElementById('fbNo');
const fbThanks = document.getElementById('fbThanks');

function openViewer(key, title, type, src){
  currentFeedbackKey = key;
  titleBox.textContent = title;
  fbYes.classList.remove('sent'); fbNo.classList.remove('sent');
  fbThanks.classList.remove('show');
  mediaBox.className = 'viewer-media';
  if(type === 'image'){
    mediaBox.innerHTML = `<img src="${esc(src)}" alt="${esc(title)}">`;
  } else if(type === 'article'){
    mediaBox.className = 'viewer-media article';
    mediaBox.innerHTML = '<div class="article-body">Đang tải bài viết...</div>';
    loadArticle(src);
  } else {
    mediaBox.innerHTML = `<video controls playsinline src="${esc(src)}"></video>`;
  }
  overlay.classList.add('open');
  logView(key);
}
/* ---- BÀI VIẾT: tải đoạn HTML do trang quản trị tạo, lọc lại bằng danh sách thẻ cho phép ---- */
const ART_TAGS = new Set(['P','BR','H2','H3','H4','UL','OL','LI','B','STRONG','I','EM','U','A','IMG','BLOCKQUOTE','HR','DIV','SPAN','TABLE','THEAD','TBODY','TR','TH','TD']);
function sanitizeArticle(html){
  const doc = new DOMParser().parseFromString('<div id="r">'+html+'</div>', 'text/html');
  const root = doc.getElementById('r');
  (function walk(node){
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType === 3) return;
      if(ch.nodeType !== 1){ ch.remove(); return; }
      if(!ART_TAGS.has(ch.tagName)){ ch.remove(); return; }
      Array.from(ch.attributes).forEach(a=>{
        const n = a.name.toLowerCase();
        const ok = (ch.tagName==='A' && (n==='href'||n==='title')) || (ch.tagName==='IMG' && (n==='src'||n==='alt')) || n==='colspan' || n==='rowspan';
        if(!ok) ch.removeAttribute(a.name);
      });
      if(ch.tagName==='A'){
        const h = (ch.getAttribute('href')||'').trim();
        if(!/^(https?:|mailto:|tel:|#)/i.test(h)) ch.removeAttribute('href');
        ch.setAttribute('target','_blank'); ch.setAttribute('rel','noopener noreferrer');
      }
      if(ch.tagName==='IMG'){
        const u = (ch.getAttribute('src')||'').trim();
        if(/^\s*(javascript|data):/i.test(u)) ch.remove();
      }
      walk(ch);
    });
  })(root);
  return root.innerHTML;
}
async function loadArticle(src){
  try{
    const r = await fetch(src, { cache: 'no-cache' });
    if(!r.ok) throw new Error(r.status);
    const html = await r.text();
    if(!overlay.classList.contains('open')) return;
    mediaBox.innerHTML = '<div class="article-body">' + sanitizeArticle(html) + '</div>';
  }catch(e){
    mediaBox.innerHTML = '<div class="article-body">Không tải được bài viết. Vui lòng thử lại sau.</div>';
  }
}
function closeViewer(){
  overlay.classList.remove('open');
  mediaBox.innerHTML = '';
  const v = mediaBox.querySelector('video');
  if(v) v.pause();
}
document.getElementById('viewerClose').addEventListener('click', closeViewer);
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeViewer(); });

app.addEventListener('click', (e)=>{
  const btn = e.target.closest('.act-btn');
  if(!btn) return;
  openViewer(btn.dataset.key, btn.dataset.title, btn.dataset.type, btn.dataset.src);
});

document.addEventListener('DOMContentLoaded', render);
